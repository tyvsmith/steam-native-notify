[plugin]
id = "me.tysmith.steam-native-notify"
name = "Steam Native Notify"
version = "0.1.0"
author = "Ty Smith"
description = "Mirrors Steam's in-client notification toasts to the desktop notification daemon via notify-send."

[assets]
# The backend materializes each platform's delivery files out of the .star at
# load (backend/main.lua, materialize_asset); a .star is never unpacked on
# disk. POSIX runs notify-action; Windows runs notify-action.ps1 (clicks
# there ride Steam's own steam:// dispatch, so there is no click handler).
resources = [
    "tools/notify-action",
    "tools/notify-action.ps1",
]

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

# No [webkit]: this plugin has no business in store/community pages.
# No [dev]: pack would otherwise poke plugin.restart over MEP after every
# build, and a backend restart mid-verification muddies tools/capture.

[compiler]
# "auto" resolves to ~/.local/share/millennium/plugins/<id>.star, so building
# IS installing; there is no separate install step.
output_path = "auto"
